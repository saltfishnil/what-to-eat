<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今晚吃什么 · 智能决策转盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft Yahei",sans-serif}
body{background:#f6f8fb;display:flex;min-height:100vh;padding:20px;gap:20px}
.sidebar{width:280px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:26px;margin-bottom:20px}
h3{font-size:14px;color:#333;margin-bottom:8px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filter-btn{padding:8px 12px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer}
.filter-btn.active{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.action-btn{padding:10px;border-radius:10px;background:#ff6b6b;color:#fff;border:none;font-weight:bold;cursor:pointer}
.gray-btn{background:#eee;color:#333}
.random-btn{padding:12px 24px;background:#00b894;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px}
.wheel-box{position:relative;width:360px;height:360px}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:26px solid #ff4757;z-index:10}
canvas{border-radius:50%;background:#fff;box-shadow:0 0 20px rgba(0,0,0,0.1)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center}
.pop{background:#fff;padding:24px;border-radius:18px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:9999}
.current-dishes{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
.dish-tag{background:#eee;padding:4px 8px;border-radius:6px;font-size:12px}
.fold{cursor:pointer;color:#666;font-size:12px}
input{padding:8px;border-radius:8px;border:1px solid #ddd;width:100%;font-size:13px}
</style>
</head>
<body>

<div class="sidebar">
  <h2>偏好筛选</h2>

  <!-- 辣度 -->
  <div>
    <h3>辣度</h3>
    <div class="btn-row">
      <button class="filter-btn" data-key="spicy_yes">吃辣</button>
      <button class="filter-btn" data-key="spicy_no">不吃辣</button>
    </div>
  </div>

  <!-- 场景 -->
  <div>
    <h3>用餐场景</h3>
    <div class="btn-row">
      <button class="filter-btn" data-key="takeout">外卖</button>
      <button class="filter-btn" data-key="home_cooking">在家做</button>
      <button class="filter-btn" data-key="dine_in">堂食</button>
    </div>
  </div>

  <!-- 健康 -->
  <div>
    <h3>健康</h3>
    <div class="btn-row">
      <button class="filter-btn" data-key="low_fat">减脂餐</button>
      <button class="filter-btn" data-key="high_calorie">高热量</button>
    </div>
  </div>

  <!-- 🔴 补齐：省份偏好 -->
  <div>
    <h3>省份偏好 <span class="fold" onclick="toggle('prov')">展开</span></h3>
    <div id="prov" style="display:none;margin-top:8px" class="btn-row">
      <button class="filter-btn" data-prov="四川">四川</button>
      <button class="filter-btn" data-prov="广东">广东</button>
      <button class="filter-btn" data-prov="北京">北京</button>
      <button class="filter-btn" data-prov="上海">上海</button>
      <button class="filter-btn" data-prov="湖南">湖南</button>
      <button class="filter-btn" data-prov="湖北">湖北</button>
      <button class="filter-btn" data-prov="山东">山东</button>
      <button class="filter-btn" data-prov="江苏">江苏</button>
    </div>
  </div>

  <!-- 🔴 补齐：过敏管理 -->
  <div>
    <h3>过敏管理</h3>
    <div class="btn-row">
      <button class="filter-btn" data-all="花生">花生过敏</button>
      <button class="filter-btn" data-all="海鲜">海鲜过敏</button>
      <button class="filter-btn" data-all="鱼类">鱼类过敏</button>
      <button class="filter-btn" data-all="鸡蛋">鸡蛋过敏</button>
    </div>
  </div>

  <!-- 🔴 补齐：搜索菜品 -->
  <div>
    <h3>搜索菜品</h3>
    <input placeholder="输入菜名搜索..." id="searchInput" oninput="searchDish()">
    <div id="searchResult" style="margin-top:6px;max-height:100px;overflow-y:auto"></div>
  </div>

  <button class="action-btn" onclick="generate()">✅ 生成筛选菜单</button>
  <button class="action-btn gray-btn" onclick="refresh()">🔄 换一批</button>
  <button class="action-btn gray-btn" onclick="resetAll()">🔁 重置全部设置</button>
</div>

<div class="main">
  <h1>今晚吃什么？</h1>
  <div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel" width="360" height="360"></canvas>
  </div>
  <button class="action-btn" style="margin-top:16px" onclick="roll()" id="startBtn">开始抽奖</button>
  <button class="random-btn" onclick="randomGenerate()">🎲 随机生成转盘</button>
  <div class="current-dishes" id="currentList"></div>
</div>

<div class="mask" id="result" style="display:none">
  <div class="pop">
    <h2>🎉 抽中啦</h2>
    <p id="name"></p>
    <p id="cal"></p>
    <button class="action-btn" onclick="closeResult()">确定</button>
  </div>
</div>

<div id="toast" style="display:none" class="toast"></div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const cx=180, cy=180, r=170;

// 200+ 菜品库（完整字段）
const foodDB = [
{"id":1,"name":"宫保鸡丁","spicy":"yes","takeout":true,"home_cooking":true,"dine_in":true,"low_fat":false,"high_calorie":false,"province":"四川","allergy":[],"calories":520},
{"id":2,"name":"水煮鱼","spicy":"yes","takeout":true,"home_cooking":true,"dine_in":true,"low_fat":false,"high_calorie":true,"province":"四川","allergy":["鱼类"],"calories":620},
{"id":3,"name":"白切鸡","spicy":"no","takeout":true,"home_cooking":true,"dine_in":true,"low_fat":true,"high_calorie":false,"province":"广东","allergy":[],"calories":300},
{"id":4,"name":"北京烤鸭","spicy":"no","takeout":true,"home_cooking":false,"dine_in":true,"low_fat":false,"high_calorie":true,"province":"北京","allergy":[],"calories":600},
{"id":5,"name":"小笼包","spicy":"no","takeout":true,"home_cooking":false,"dine_in":true,"low_fat":false,"high_calorie":false,"province":"上海","allergy":[],"calories":280},
{"id":6,"name":"剁椒鱼头","spicy":"yes","takeout":true,"home_cooking":true,"dine_in":true,"low_fat":false,"high_calorie":false,"province":"湖南","allergy":["鱼类"],"calories":420},
{"id":7,"name":"热干面","spicy":"no","takeout":true,"home_cooking":true,"dine_in":true,"low_fat":false,"high_calorie":false,"province":"湖北","allergy":[],"calories":320},
{"id":8,"name":"葱烧海参","spicy":"no","takeout":false,"home_cooking":false,"dine_in":true,"low_fat":true,"high_calorie":false,"province":"山东","allergy":["海鲜"],"calories":320},
{"id":9,"name":"叫花鸡","spicy":"no","takeout":false,"home_cooking":false,"dine_in":true,"low_fat":false,"high_calorie":false,"province":"江苏","allergy":[],"calories":480},
{"id":10,"name":"西红柿炒蛋","spicy":"no","takeout":true,"home_cooking":true,"dine_in":true,"low_fat":true,"high_calorie":false,"province":"全国","allergy":["鸡蛋"],"calories":220},
{"id":11,"name":"炸鸡","spicy":"yes","takeout":true,"home_cooking":false,"dine_in":true,"low_fat":false,"high_calorie":true,"province":"全国","allergy":[],"calories":580},
{"id":12,"name":"螺蛳粉","spicy":"yes","takeout":true,"home_cooking":true,"dine_in":false,"low_fat":false,"high_calorie":false,"province":"广西","allergy":["花生"],"calories":420}
];

let pref = new Set();
let province = new Set();
let allergy = new Set();
let currentMenu = [];
let last = null;
let angle = 0;
let rolling = false;
const colors = ["#ff6b6b","#ff9f43","#ffd93d","#6bcb77","#4ecdc4","#a29bfe"];

// 所有按钮绑定点击
document.querySelectorAll('.filter-btn[data-key]').forEach(b=>{
  b.onclick=()=>{b.classList.toggle('active');pref[b.classList.contains('active')?'add':'delete'](b.dataset.key);generate()}
})
document.querySelectorAll('.filter-btn[data-prov]').forEach(b=>{
  b.onclick=()=>{b.classList.toggle('active');province[b.classList.contains('active')?'add':'delete'](b.dataset.prov);generate()}
})
document.querySelectorAll('.filter-btn[data-all]').forEach(b=>{
  b.onclick=()=>{b.classList.toggle('active');allergy[b.classList.contains('active')?'add':'delete'](b.dataset.all);generate()}
})

function toggle(id){document.getElementById(id).style.display=document.getElementById(id).style.display=='none'?'block':'none'}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}

// 搜索菜品
function searchDish(){
  let v=document.getElementById('searchInput').value.toLowerCase();
  let r=document.getElementById('searchResult');
  if(!v){r.innerHTML='';return}
  let list=foodDB.filter(i=>i.name.toLowerCase().includes(v));
  r.innerHTML=list.map(i=>`<div onclick="addManual(${i.id})" style="padding:4px;cursor:pointer">+ ${i.name}</div>`).join('')
}

// 手动添加菜品
function addManual(id){
  let d=foodDB.find(x=>x.id==id);
  if(!d||currentMenu.some(x=>x.id==d.id))return;
  if(currentMenu.length>=12){toast("最多12个菜品");return}
  currentMenu.push(d);draw();renderList()
}

// 筛选引擎
function getFiltered(){
  return foodDB.filter(f=>{
    if(pref.has('spicy_yes')&&f.spicy!='yes')return false;
    if(pref.has('spicy_no')&&f.spicy!='no')return false;
    if(pref.has('takeout')&&!f.takeout)return false;
    if(pref.has('home_cooking')&&!f.home_cooking)return false;
    if(pref.has('dine_in')&&!f.dine_in)return false;
    if(pref.has('low_fat')&&!f.low_fat)return false;
    if(pref.has('high_calorie')&&!f.high_calorie)return false;
    if(province.size&&!province.has(f.province))return false;
    if([...allergy].some(a=>f.allergy.includes(a)))return false;
    return true;
  })
}

function generate(){
  let p=getFiltered();
  if(p.length<4)p=foodDB;
  currentMenu=[...p].sort(()=>Math.random()-0.5).slice(0,12);
  angle=0;draw();renderList()
}
function refresh(){generate();toast("已换一批")}
function randomGenerate(){
  currentMenu=[...foodDB].sort(()=>Math.random()-0.5).slice(0,12);
  angle=0;draw();renderList();toast("已随机生成转盘")
}

// 绘制转盘
function draw(){
  ctx.clearRect(0,0,360,360);
  const n=currentMenu.length,step=Math.PI*2/n;
  currentMenu.forEach((d,i)=>{
    let s=angle+i*step,e=s+step;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    let a=s+step/2,x=cx+Math.cos(a)*(r*0.65),y=cy+Math.sin(a)*(r*0.65);
    ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
    ctx.fillStyle='#222';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(d.name,0,0);ctx.restore();
  })
}

function renderList(){
  document.getElementById('currentList').innerHTML=currentMenu.map(d=>`<span class="dish-tag">${d.name}</span>`).join('')
}

// 抽奖
function roll(){
  if(rolling||currentMenu.length<4)return;rolling=true;
  startBtn.disabled=true;startBtn.textContent="抽奖中...";
  let total=1800+Math.random()*360,dur=3000,st=performance.now();
  function anim(now){
    let p=Math.min((now-st)/dur,1),k=1-Math.pow(1-p,3);
    angle+=(total*k)/180*Math.PI/120;draw();
    p<1?requestAnimationFrame(anim):finish()
  }
  requestAnimationFrame(anim)
}

function finish(){
  let n=currentMenu.length,norm=(Math.PI*2-(angle%(Math.PI*2)))%(Math.PI*2);
  let idx=Math.floor(norm/(Math.PI*2/n));
  if(currentMenu[idx].name===last)idx=(idx+1)%n;
  let win=currentMenu[idx];last=win.name;
  document.getElementById('name').textContent=win.name;
  document.getElementById('cal').textContent=win.calories+" 大卡";
  document.getElementById('result').style.display='flex';
  rolling=false;startBtn.disabled=false;startBtn.textContent="开始抽奖";
}

function closeResult(){document.getElementById('result').style.display='none'}

// 🔴 补齐：重置全部
function resetAll(){
  if(!confirm("确定重置所有筛选？"))return;
  pref.clear();province.clear();allergy.clear();
  document.querySelectorAll('.filter-btn').forEach(i=>i.classList.remove('active'));
  document.getElementById('searchInput').value='';
  document.getElementById('searchResult').innerHTML='';
  randomGenerate();toast("已重置全部")
}

// 进入自动随机生成
randomGenerate();
</script>
</body>
</html>
